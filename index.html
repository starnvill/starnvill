<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>별과 마을 · Star n Vill'</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070c1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="별과 마을">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Nanum+Myeongjo:wght@400;700&family=Noto+Serif+KR:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a winter grand hotel at night. Line-drawn houses on a midnight horizon -> a velvet-and-marble room -> the sky outside. Champagne hairlines, serif type, one warm light source per scene. */
:root{
  --midnight:#080e20;
  --navy:#101a36;
  --champagne:#c8b07a;
  --ivory:#efe8da;
  --muted:#8d95aa;
  --bordeaux:#5b1d25;
  --olive:#5d6343;
  --ink:#1b1712;
  --line:rgba(200,176,122,.32);
  --font-display:'Cormorant Garamond','Nanum Myeongjo',Georgia,serif;
  --font-serif-ko:'Nanum Myeongjo','Cormorant Garamond','AppleMyungjo',serif;
  --font-scene:'Noto Serif KR','Noto Serif CJK KR','Nanum Myeongjo',serif;
  --font-body:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:hidden;overscroll-behavior-x:none}
html{touch-action:pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#ed{touch-action:none}
@media (hover:none) and (pointer:coarse){input,textarea,select{font-size:16px!important}}
body{position:relative;width:100%;background:var(--midnight);color:var(--ivory);font-family:var(--font-body);font-weight:300;font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--champagne);outline-offset:4px;border-radius:2px}
#sky-bg,#snow-fg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#snow-fg{z-index:3}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100%;padding:calc(22px + env(safe-area-inset-top)) 20px calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
h2,h3{font-family:var(--font-serif-ko)}
.caps{font-family:var(--font-display);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--champagne);font-weight:500}
.rule{display:flex;align-items:center;gap:12px;color:var(--champagne);font-size:10px;margin:18px 0}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--line)}

/* village */
.v-head{text-align:center;padding:14px 0 4px}
.v-head h1{font-family:var(--font-display);font-style:italic;font-weight:400;font-size:clamp(34px,11vw,52px);white-space:nowrap;line-height:1;letter-spacing:-.01em;margin:10px 0 0}
.v-head h1 em{font-style:italic;color:var(--champagne)}
.v-date{font-family:var(--font-serif-ko);font-size:13px;color:var(--muted);margin:10px 0 0}
.v-date b{color:var(--champagne);font-weight:400}
.dcount{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-top:2px}
.dcount .n{font-family:var(--font-display);font-size:64px;line-height:1;font-weight:400;font-variant-numeric:lining-nums tabular-nums}
.dcount .l{font-family:var(--font-serif-ko);font-size:13px;color:var(--muted)}
.dcount .xmas{font-family:var(--font-display);font-style:italic;font-size:30px;color:var(--champagne)}
.village{display:grid;grid-template-columns:1fr 1fr;gap:26px 18px;padding:6px 0 10px}
.house-card{background:none;border:0;padding:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.house-card svg{width:100%;height:auto;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.house-card:hover svg,.house-card:focus-visible svg{transform:translateY(-4px)}
.house-card .no{margin-top:6px}
.house-card .name{font-family:var(--font-serif-ko);font-size:17px;color:var(--ivory)}
.house-card .meta{font-size:12px;color:var(--muted)}
.notice{font-size:11.5px;color:var(--champagne);display:inline-flex;align-items:center;gap:6px}
.notice::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--champagne);box-shadow:0 0 8px var(--champagne)}
.lot{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.lot svg{width:100%;height:auto;display:block;opacity:.75;transition:opacity .3s}
.lot:hover svg{opacity:1}
.lot .name{font-family:var(--font-serif-ko);font-size:15px;color:var(--muted)}
.v-foot{font-size:12px;color:var(--muted);text-align:center;margin:22px 12px 0;line-height:1.7}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.topbar .title{flex:1;text-align:center}
.topbar h2{font-size:20px}
.link-btn{background:none;border:0;padding:6px 0;font-family:var(--font-display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--champagne);min-width:64px}
.link-btn.r{text-align:right}
.link-btn:hover{color:var(--ivory)}
.sub-date{text-align:center;font-family:var(--font-serif-ko);font-size:12.5px;color:var(--muted);margin:0 0 14px}
.sub-date b{color:var(--champagne);font-weight:400}

/* room */
.house-screen{--wall:#4a1820;--wall-side:#3a121a;--wall-deep:#240a10;--rug:#5d6343;--chair:#3f4430;--chair-2:#4b5139}
.house-screen.theme-olive{--wall:#3c412d;--wall-side:#2f3323;--wall-deep:#1d2015;--rug:#5b1d25;--chair:#4c1a22;--chair-2:#5b2029}
.house-screen.theme-blue{--wall:#16224a;--wall-side:#111a3a;--wall-deep:#090f24;--rug:#5b1d25;--chair:#3f4430;--chair-2:#4b5139}
.room{position:relative;aspect-ratio:360/380;margin:6px -20px 0;overflow:hidden}
.room>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.room>svg.room-live{pointer-events:none;will-change:transform;inset:auto;left:34.722%;top:18.421%;width:30.556%;height:47.368%}
.win-snow{position:absolute;top:11.579%;height:52.632%;width:16.111%;left:1.667%;pointer-events:none;container-type:size;overflow:hidden;clip-path:polygon(0 0,100% 11%,100% 74%,0 100%)}
.win-snow.r{left:82.222%;clip-path:polygon(0 11%,100% 0,100% 100%,0 74%)}
.win-snow i{position:absolute;top:-6px;border-radius:50%;background:#fff;opacity:.85;animation:wfall2 7s linear infinite;will-change:transform}
@keyframes wfall2{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(4px,52cqh,0)}100%{transform:translate3d(-2px,106cqh,0)}}
@media (prefers-reduced-motion:reduce){.win-snow i{animation:none;top:auto}}
.flame{transform-origin:180px 239px;animation:flick 1.6s ease-in-out infinite alternate}
.flame.f2{animation-duration:1.1s}
.flame.f3{animation-duration:2s}
.glow{animation:glow 2.6s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(.92) skewX(-1.5deg)}to{transform:scaleY(1.05) skewX(2deg)}}
@keyframes glow{from{opacity:.4}to{opacity:.68}}
.stocking{position:absolute;top:39%;width:12%;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;transform-origin:50% 0}
.stocking.s-to{left:36.2%}
.stocking.s-me{left:52%}
.stocking svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.stocking .badge{position:absolute;top:-2px;right:-7px;min-width:17px;height:17px;border-radius:50%;background:var(--champagne);color:var(--ink);font-family:var(--font-display);font-size:11.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.stocking:hover{animation:sway 1.4s ease-in-out}
.stocking .tag{margin-top:-9px;background:#efe8da;color:var(--ink);font-family:var(--font-scene);font-weight:500;font-size:8.5px;letter-spacing:-.02em;text-transform:none;opacity:1;line-height:1.5;padding:1px 6px;outline:.5px solid rgba(200,176,122,.75);outline-offset:-2.5px;white-space:nowrap;transform:rotate(-5deg);box-shadow:0 2px 3px rgba(0,0,0,.35);border:1px solid rgba(200,176,122,.7)}
.stocking .tag.me{transform:translateX(-3px) rotate(4deg);background:#8c2f3a;color:#efe8da}
.stocking.s-to .tag{transform:translateX(4px) rotate(-5deg)}
.stocking .tag,.stocking .tag.me{letter-spacing:0}
.bounce{animation:settle .7s ease}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(4deg)}70%{transform:rotate(-3deg)}}
@keyframes settle{0%{transform:scale(1)}35%{transform:scale(1.1,.92)}70%{transform:scale(.97,1.04)}100%{transform:scale(1)}}
.globe-btn{position:absolute;left:81.9%;bottom:22.4%;width:13.3%;background:none;border:0;padding:0}
.globe-btn svg{width:100%;height:auto;display:block;transform-origin:50% 90%}
.globe-btn.locked svg{filter:grayscale(.75) brightness(.6);animation:none!important}
.primary.locked{opacity:.55;cursor:not-allowed}
.globe-btn:hover svg,.shake svg{animation:shake .9s ease}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin:14px 4px 0;font-size:12px;color:var(--muted)}
.legend span b{font-family:var(--font-display);font-size:15px;color:var(--champagne);font-weight:500;margin-left:4px}

.primary{width:100%;border:0;border-radius:2px;padding:15px 16px;background:var(--champagne);color:var(--ink);font-size:14.5px;font-weight:500;letter-spacing:.06em;margin-top:18px;font-family:var(--font-body);transition:background .2s}
.primary:hover{background:#d6c08d}
.primary:disabled{background:none;border:1px solid var(--line);color:var(--muted);cursor:default}
.ghost{width:100%;border:1px solid var(--line);background:none;border-radius:2px;padding:12px 16px;margin-top:10px;font-size:13.5px;color:var(--ivory)}
.ghost:hover{border-color:var(--champagne)}

.sect{margin-top:34px}
.sect-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin-bottom:16px}
.sect-head h3{font-size:18px}
.sect-head p{font-size:12.5px;color:var(--muted);margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px}
.mat{background:var(--mat,#efe8da);padding:7px 7px 0;border:0;color:var(--ink);text-align:center;position:relative;box-shadow:0 10px 24px rgba(0,0,0,.4);display:block;width:100%}
.mat .pic{position:relative}
.mat .pic::after{content:"";position:absolute;inset:-3px;border:1px solid rgba(160,130,70,.45);pointer-events:none}
.mat img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.mat .cap{font-family:var(--font-serif-ko);font-size:11.5px;line-height:1.45;padding:8px 2px 9px;min-height:32px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mat.dark{color:var(--ivory)}
.mat-date{display:block;text-align:center;margin-top:7px;font-family:var(--font-display);font-size:11px;letter-spacing:.2em;color:var(--muted)}
.mat-date.sp{color:var(--champagne)}
.env{aspect-ratio:1/1.18;background:linear-gradient(170deg,#f1ebdf,#e2d8c5);color:var(--ink);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 10px 24px rgba(0,0,0,.4);overflow:hidden}
.env::before{content:"";position:absolute;left:0;right:0;top:0;height:44%;background:linear-gradient(to bottom right,transparent 49.6%,rgba(120,100,70,.22) 50%,transparent 51%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49.6%,rgba(120,100,70,.22) 50%,transparent 51%) right/50% 100% no-repeat}
.env::after{content:"";position:absolute;inset:5px;border:1px solid rgba(200,176,122,.55);pointer-events:none}
.env.sp::after{border-color:var(--champagne);border-width:1.5px}
.seal{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a2f3a,#4e161e);display:grid;place-items:center;font-family:var(--font-display);font-style:italic;font-size:15px;color:#e9cf9a;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.env .hint{font-family:var(--font-serif-ko);font-size:15px;z-index:1;margin-top:4px}
.env .lbl{font-family:var(--font-display);font-size:10.5px;letter-spacing:.2em;color:#8c7a5c;z-index:1}
.themes{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.themes button{border:1px solid var(--line);background:none;border-radius:2px;padding:8px 12px;font-size:12.5px;display:flex;align-items:center;gap:8px;color:var(--ivory)}
.themes button i{width:12px;height:12px;border-radius:50%;display:block;border:1px solid var(--line)}
.themes button[aria-pressed="true"]{border-color:var(--champagne);color:var(--champagne)}
.empty{font-size:13px;color:var(--muted);text-align:center;border:1px solid var(--line);padding:18px;margin:0}

/* sky */
.sky-svg{width:100%;height:auto;display:block;margin-top:4px}
.sky-note{font-family:var(--font-serif-ko);font-size:13.5px;color:var(--muted);text-align:center;margin:10px 8px 0;line-height:1.8}
.sky-note b{color:var(--ivory);font-weight:400}
@keyframes draw{to{stroke-dashoffset:0}}
.bigstar{cursor:pointer}
.bigstar.on .halo{animation:pulse 3s ease-in-out infinite}
.halo{transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.42;transform:scale(1.12)}}
.letter-box textarea{width:100%;min-height:170px;border:0;border-radius:0;background:#f1ebdf;color:var(--ink);padding:18px 18px;font-family:var(--font-serif-ko);font-size:15px;line-height:1.9;resize:vertical;box-shadow:inset 0 0 0 1px rgba(200,176,122,.55),inset 0 0 0 6px #f1ebdf,inset 0 0 0 7px rgba(200,176,122,.35)}

/* sheets */
.modal{position:fixed;inset:0;z-index:20;background:rgba(4,7,16,.72);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;background:var(--navy);border-top:1px solid var(--line);padding:22px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.sheet header{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
.sheet header .t{flex:1}
.sheet header h2{font-size:19px;margin-top:4px}
.banner{border:1px solid var(--line);padding:10px 12px;font-family:var(--font-serif-ko);font-size:13px;color:var(--champagne);margin-bottom:16px;text-align:center}
.canvas-frame{background:var(--mat,#efe8da);padding:12px 12px 30px;max-width:320px;margin:0 auto;box-shadow:0 14px 34px rgba(0,0,0,.5);transition:background .25s}
.canvas-frame .pic{position:relative}
.canvas-frame .pic::after{content:"";position:absolute;inset:-4px;border:1px solid rgba(160,130,70,.45);pointer-events:none}
#ed{width:100%;aspect-ratio:1;display:block;touch-action:none;background:#e5dfd2}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:16px}
.btn{border:1px solid var(--line);background:none;border-radius:2px;padding:8px 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--ivory)}
.btn:hover{border-color:var(--champagne)}
.btn[aria-pressed="true"]{border-color:var(--champagne);color:var(--champagne)}
.palette{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.palette button{width:37px;height:37px;border:1px solid var(--line);background:rgba(239,232,218,.03);display:grid;place-items:center;padding:7px;border-radius:2px}
.palette button svg{width:100%;height:100%}
.palette button:hover{border-color:var(--champagne)}
.palette .sw{border-radius:50%;width:30px;height:30px;padding:0}
.palette .sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--navy),0 0 0 4px var(--champagne)}
.frames{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;font-size:12px;color:var(--muted)}
.frames button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);padding:0}
.frames button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--navy),0 0 0 4px var(--champagne)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:18px}
.field label{font-size:13px;color:var(--ivory)}
.field label span{color:var(--muted);font-size:12px;margin-left:6px}
.field input,.field textarea,.field select{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:8px 2px;font-size:15px;font-family:var(--font-serif-ko)}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-bottom-color:var(--champagne)}
.field select option{background:var(--navy)}
.field textarea{min-height:64px;resize:vertical}
.err{color:#e3a99a;font-size:12.5px;margin:10px 0 0;min-height:1em;text-align:center}
.tabs{display:flex;margin:4px 0 16px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;font-size:13.5px;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ivory);border-bottom-color:var(--champagne)}
.wish{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 2px;border-bottom:1px solid rgba(200,176,122,.14)}
.wish .wn{font-family:var(--font-serif-ko);font-size:15.5px}
.wish a{color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.wish .status{grid-column:1/-1;font-family:var(--font-serif-ko);font-size:13px;color:var(--champagne)}
.wish .status.wait{color:var(--muted)}
.wish .note{grid-column:1/-1;font-size:11.5px;color:var(--muted)}
.globe-hero{width:130px;margin:0 auto 10px}
.globe-hero svg{width:100%;height:auto}
.letter-paper{background:#f1ebdf;color:var(--ink);padding:28px 24px;font-family:var(--font-serif-ko);font-size:15px;line-height:2;white-space:pre-wrap;box-shadow:inset 0 0 0 1px rgba(200,176,122,.6),inset 0 0 0 7px #f1ebdf,inset 0 0 0 8px rgba(200,176,122,.35),0 14px 34px rgba(0,0,0,.5);position:relative}
.letter-paper .seal{position:absolute;right:18px;top:18px;width:34px;height:34px;font-size:18px}
.hint-text{text-align:center;font-size:12.5px;color:var(--muted);margin:14px 0 0}

/* sleigh */
.sleigh-layer{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.sleigh-layer .sleigh{position:absolute;left:0;top:78px;width:240px;transform:translateX(-280px)}
.sleigh-layer .drop{position:absolute;width:30px;height:30px}
.sleigh-layer .drop.big{width:44px;height:44px}
.dust{position:absolute;width:3px;height:3px;border-radius:50%;background:#f3dfae;box-shadow:0 0 6px #e8cf93}

/* demo bar + toast */
.demo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:15;display:flex;align-items:center;gap:6px;background:rgba(8,14,32,.9);border:1px solid var(--line);padding:6px 4px 6px 12px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 24px);backdrop-filter:blur(6px)}
.demo label{white-space:nowrap}
.demo select{background:none;color:var(--ivory);border:1px solid var(--line);border-radius:2px;padding:5px 6px;font-size:12.5px;max-width:112px;font-family:var(--font-serif-ko)}
.demo select option{background:var(--navy)}
.demo button{border:0;background:none;color:var(--muted);padding:5px 8px;font-size:12px;white-space:nowrap;flex-shrink:0}
.demo button:hover{color:var(--ivory)}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translate(-50%,-160%);z-index:40;background:rgba(16,26,54,.96);color:var(--ivory);border:1px solid var(--line);padding:11px 18px;font-family:var(--font-serif-ko);font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.45);transition:transform .45s cubic-bezier(.2,.7,.2,1);max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.smoke circle{fill:rgba(239,232,218,.35);animation:smoke 4s ease-in-out infinite}
.scene .smoke{display:none}.scene .smoke circle{animation:none}.scene .win-glow{animation:none;opacity:1}

.ob-card{max-width:340px;width:100%}

.ob-alt{background:transparent;color:var(--ivory);border:1px solid var(--line)}

.end-link{display:block;margin:10px auto 0;font-size:12px;color:var(--champagne);letter-spacing:.04em}
.end-cta{text-align:center}.end-cta .primary{margin-top:14px}
.ending{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:60px 28px 200px;text-align:center;word-break:keep-all;cursor:pointer}
.end-text{max-width:340px;animation:endIn 1.6s ease both}

.end-t{font-family:var(--font-serif-ko);font-size:19px;line-height:2;color:var(--ivory);margin:0}

.end-t .ap{color:var(--champagne)}

.end-skip{position:fixed;top:14px;left:14px;z-index:30;font-size:12px;color:var(--muted)}
.end-last h2{font-family:var(--font-serif-ko);font-weight:400;font-size:26px;color:var(--ivory);margin:10px 0 26px}
.end-sign{font-family:var(--font-serif-ko);font-size:14px;line-height:2;color:var(--ivory);opacity:.8;margin:0 0 26px;animation:endIn 1.6s ease 1s both}
.end-sign i{font-style:normal;color:var(--champagne)}
.end-see{font-family:var(--font-display);font-style:italic;font-size:20px;color:var(--champagne);margin:0 0 28px;animation:endIn 1.6s ease 2s both}
.end-btns{display:flex;flex-direction:column;align-items:center;gap:12px;animation:endIn 1.2s ease 2.8s both}
.end-scene{position:fixed;left:0;right:0;bottom:0;width:100%;height:auto;max-height:34vh;pointer-events:none}
.enwin{opacity:0;transition:opacity 1.8s ease}.enwin.on{opacity:.9}
.end-star{opacity:0;transition:opacity 2.5s ease 1.5s;filter:drop-shadow(0 0 6px #ffe3a0)}.end-star.on{opacity:1}
.on-end .amb-sound{display:none}.on-end .demo{opacity:.4}
.end-last{max-width:380px;width:100%;cursor:default}
.dev-letter{position:relative;text-align:left;font-size:13.5px;line-height:1.95;margin:0 0 26px;animation:endIn 1.6s ease .4s both}
.dev-sign{text-align:right;margin:22px 0 0;white-space:normal;line-height:1.8;color:#5e1f29}

.locked .demo,.locked #swapBtn,.locked .amb-sound{display:none!important}
.lockscreen{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:60px 28px 220px;text-align:center;word-break:keep-all}
.lock-text{animation:endIn 1.8s ease both}
.lock-t{font-family:var(--font-serif-ko);font-weight:400;font-size:24px;line-height:1.7;letter-spacing:-.01em;color:var(--ivory);margin:14px 0 0}
.lock-s{font-size:13px;line-height:1.9;color:var(--muted);margin:14px 0 0;animation:endIn 1.8s ease 1s both}
.lock-count{margin:34px 0 0;display:flex;align-items:baseline;justify-content:center;gap:6px;animation:endIn 1.8s ease 1.8s both}
.lock-count b{font-family:var(--font-display);font-weight:400;font-size:30px;color:var(--champagne);margin-left:8px}
.lock-count b:first-child{margin-left:0}
.lock-count i{font-style:normal;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.locked .end-star{opacity:1}
.ending.is-last{align-items:flex-start;padding-top:70px;cursor:default}
.ending.is-last .end-scene{position:absolute}
.dev-final{margin:20px 0 0;text-align:center;font-family:var(--font-display);font-style:italic;font-size:24px;color:#5e1f29;white-space:normal}
.boxstage{position:fixed;inset:0;z-index:18;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.boxstage.done{pointer-events:auto;background:radial-gradient(ellipse at 50% 45%,rgba(200,176,122,.08),transparent 60%)}
.box-wrap{width:min(62vw,240px);animation:boxIn .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes boxIn{from{opacity:0;transform:translateY(30px) scale(.8)}to{opacity:1;transform:none}}
.gbox{width:100%;height:auto;overflow:visible}
.gbox-lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.box-wrap.opening .gbox-lid{transform:translateY(-46px) rotate(-12deg)}
.box-wrap.closed .gbox-lid{transform:none}
.gbox-bow{transform-box:fill-box;transform-origin:50% 100%}
.box-wrap.closed .gbox-bow{animation:bowpop .6s ease .5s both}
@keyframes bowpop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
.box-wrap.closed{animation:boxBob 3.6s ease-in-out 1.4s infinite}
@keyframes boxBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.box-after{text-align:center;margin-top:26px;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:12px}
.boxstage.done .box-after > *{animation:endIn 1.2s ease both}
.box-msg{font-family:var(--font-serif-ko);font-size:15px;line-height:1.9;color:var(--ivory);margin:0 0 8px}
.box-reopen{font-size:11.5px;color:var(--muted)}
.exp-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.exp{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px 16px;border:1px solid var(--line);background:rgba(200,176,122,.04);color:var(--ivory);border-radius:3px}
.exp b{font-family:var(--font-serif-ko);font-weight:400;font-size:15px}.exp span{font-size:12px;color:var(--muted)}
.ob-phone{width:118px;height:118px;border-radius:26px;background:linear-gradient(160deg,#16224a,#0a1026);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.ob-phone img{width:58px;height:58px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.ob-phone span{font-family:var(--font-display);font-size:10px;color:var(--ivory);letter-spacing:.04em}
.ob-steps{list-style:none;margin:22px 0 22px;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.ob-steps li{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:3px;background:rgba(200,176,122,.04)}
.ob-steps i{font-style:normal;font-family:var(--font-display);font-size:18px;color:var(--champagne);line-height:1.2;min-width:12px}
.ob-steps b{display:block;font-family:var(--font-serif-ko);font-weight:400;font-size:14px;color:var(--ivory)}
.ob-steps span{font-size:12px;color:var(--muted);line-height:1.6}.ob-steps span b{display:inline;font-family:inherit;font-size:inherit;color:var(--champagne)}
.ob-ico{display:inline-flex;align-items:center;vertical-align:-2px;padding:1px 3px;border:1px solid var(--line);border-radius:3px;font-size:10px;color:var(--ivory)}
.ob-done-note{color:var(--champagne);font-size:13px;margin:20px 0}
.ko-name{font-family:var(--font-serif-ko);font-size:14px;letter-spacing:.5em;word-spacing:-.35em;color:var(--champagne);margin:6px 0 0;padding-left:.5em}
.ob-hero .ko-name{margin:-10px 0 18px}
.with{letter-spacing:0;margin-right:.18em}
.with{font-family:var(--font-display);font-style:italic;color:var(--champagne);font-size:.92em;letter-spacing:.02em;margin-right:.08em}
.shoot{position:absolute;height:1.6px;border-radius:2px;background:linear-gradient(90deg,rgba(255,244,220,0),rgba(255,244,220,.95));box-shadow:0 0 6px rgba(255,236,190,.8);transform-origin:100% 50%;pointer-events:none}
.shoot.rtl{background:linear-gradient(270deg,rgba(255,244,220,0),rgba(255,244,220,.95));transform-origin:0 50%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.cline{stroke-dashoffset:0}.lbl-in{opacity:1}}
@media (max-width:360px){.v-head h1{font-size:34px}.dcount .n{font-size:54px}.grid3{gap:12px 8px}}
@media (min-width:640px){
  #app{max-width:600px}
  .scene{-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
  .room{margin-left:0;margin-right:0;border-radius:3px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
}
@media (min-width:1100px) and (min-height:820px){#app{max-width:660px}}
.cloud .demo,.cloud #swapBtn{display:none!important}
.pending-note{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0 4px;padding:10px 12px;border:1px solid var(--line);background:rgba(8,14,32,.6);font-size:12.5px;color:var(--muted);font-family:var(--font-serif-ko)}
.pending-note .btn{white-space:nowrap}
.del-acct{display:block;margin:18px auto 0;color:var(--muted);font-size:12px;text-decoration:underline}
.primary.danger{background:#7a2a33;color:#f6eee4}
.invite-link{margin:14px 0 6px;padding:12px;border:1px solid var(--line);font-size:12.5px;word-break:break-all;color:var(--champagne);-webkit-user-select:all;user-select:all}

/* ---------- cocoa ball, tree, lucky things ---------- */
.mug-btn{position:absolute;left:36.1%;top:64%;width:9.4%;height:9.4%;background:none;border:0;padding:0;border-radius:50%}
.tree-btn{position:absolute;left:64.2%;top:36.6%;width:17%;height:28.4%;background:none;border:0;padding:0}
.mug-btn:focus-visible,.tree-btn:focus-visible{outline:1px solid var(--champagne)}
.mug-btn.ready::after{content:'';position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,217,143,.32),rgba(255,217,143,0) 62%);animation:mugHint 2.6s ease-in-out infinite;will-change:opacity;pointer-events:none}
@keyframes mugHint{0%,100%{opacity:.15}50%{opacity:1}}
.orn-new{animation:ornDrop 1.1s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:50% 0}
@keyframes ornDrop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.meteor{stroke-dasharray:30 200;animation:meteor 5.5s linear infinite}.meteor.m2{animation-delay:2.7s}
@keyframes meteor{0%{stroke-dashoffset:30;opacity:0}6%{opacity:1}22%{stroke-dashoffset:-60;opacity:0}100%{stroke-dashoffset:-60;opacity:0}}
.santa-fly{animation:santa 16s linear infinite}
@keyframes santa{from{transform:translate(380px,150px)}to{transform:translate(270px,70px)}}
.fx-lights .bulb,.blink .bulb{opacity:.25;transition:opacity .25s}
[data-ph="0"] .fx-lights .bulb.b0,[data-ph="1"] .fx-lights .bulb.b1,[data-ph="2"] .fx-lights .bulb.b2,[data-ph="0"] .blink .bulb.b0,[data-ph="1"] .blink .bulb.b1,[data-ph="2"] .blink .bulb.b2{opacity:1}
.fx-line{text-align:center;font-family:var(--font-serif-ko);font-size:12px;color:var(--champagne);margin:-8px 0 12px;opacity:.9}
.cocoa-open{overflow:hidden}
.cocoa-scene{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 42%,#2a1a14 0%,#120c0a 55%,#07060a 100%);clip-path:circle(0 at var(--cx) var(--cy));transition:clip-path .7s cubic-bezier(.6,0,.2,1);overflow:auto;-webkit-overflow-scrolling:touch}
.cocoa-scene.in{clip-path:circle(150% at var(--cx) var(--cy))}
.cocoa-scene.out{clip-path:circle(0 at var(--cx) var(--cy));transition-duration:.5s}
.cs-close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:2}
.cs-inner{max-width:420px;margin:0 auto;padding:calc(54px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));text-align:center}
.cs-stage{width:min(62vw,240px);margin:10px auto 0}
.cs-mug{width:100%;height:auto;display:block;overflow:visible}
.cs-milk{stroke-dasharray:120;stroke-dashoffset:120;opacity:0}
.cs-mug.pour .cs-milk{animation:milk 1.5s ease-in forwards}
@keyframes milk{0%{opacity:1;stroke-dashoffset:120}55%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:-120}}
.cs-ball{transform-box:fill-box;transform-origin:50% 100%}
.cs-mug.pour .cs-ball{animation:melt 1.6s .7s ease-in forwards}
@keyframes melt{0%{transform:none;opacity:1}60%{transform:translateY(14px) scale(1.05,.55);opacity:.9}100%{transform:translateY(22px) scale(1.25,.15);opacity:0}}
.cs-mug.done .cs-ball{opacity:0}
.cs-marsh{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.cs-mug.pour .cs-marsh{animation:marsh .7s 1.9s cubic-bezier(.3,1.6,.5,1) forwards}.cs-mug.done .cs-marsh{opacity:1}
@keyframes marsh{from{opacity:0;transform:translateY(8px) scale(.4)}to{opacity:1;transform:none}}
.cs-steam{opacity:0}.cs-mug.done .cs-steam,.cs-mug.pour .cs-steam{animation:steam 3.2s 2s ease-in-out infinite}
.cs-mug.done .cs-steam{animation-delay:0s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.cs-ctrl{min-height:70px}.cs-ctrl .primary{max-width:300px}
.cs-hint{font-size:12.5px;color:var(--muted);margin-top:10px;font-family:var(--font-serif-ko)}
.cs-note{opacity:0;transform:translateY(26px) scale(.96);pointer-events:none;transition:opacity .9s ease,transform 1s cubic-bezier(.2,.9,.3,1)}
.cs-note.show{opacity:1;transform:none;pointer-events:auto}
.cs-paper{margin:4px auto 0;max-width:340px;background:#f3ecdf;color:#2b2119;padding:24px 22px 20px;border-radius:2px;box-shadow:0 18px 50px rgba(0,0,0,.5);position:relative}
.cs-paper:before{content:'';position:absolute;inset:6px;border:1px solid rgba(140,47,58,.22);pointer-events:none}
.cs-paper .caps{color:#8c2f3a}
.cs-text{font-family:var(--font-scene);font-size:16.5px;line-height:1.75;margin:12px 0 6px;word-break:keep-all}
.cs-sub{font-size:12.5px;color:#6b5a48;margin-top:8px}
.cs-together{font-family:var(--font-serif-ko);font-size:12.5px;color:#8c2f3a;margin-top:12px}
.cs-paper .ghost{color:#2b2119;border-color:rgba(43,33,25,.25);margin-top:16px}
.tree-notes{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.tn{border:1px solid var(--line);padding:12px 14px}.tn p{font-family:var(--font-scene);font-size:13.5px;line-height:1.7;word-break:keep-all}
.tn .tn-d{font-family:var(--font-display);font-size:11px;letter-spacing:.14em;color:var(--champagne);margin-bottom:4px}
/* ---------- telepathy ---------- */
.tele-card{display:flex;align-items:center;gap:14px;width:100%;margin:16px 0 0;padding:14px 16px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(28,22,52,.75),rgba(8,14,32,.6));text-align:left;border-radius:2px}
.tele-card:hover{border-color:var(--champagne)}
.tc-orb{position:relative;flex:none;width:34px;height:34px}
.tc-orb i{position:absolute;top:7px;width:20px;height:20px;border-radius:50%;border:1px solid var(--champagne)}
.tc-orb i:first-child{left:0}.tc-orb i:last-child{right:0;border-color:#b98fd0}
.tele-card.ready .tc-orb i:first-child{animation:orbL 3.2s ease-in-out infinite}.tele-card.ready .tc-orb i:last-child{animation:orbR 3.2s ease-in-out infinite}
@keyframes orbL{50%{transform:translateX(4px)}}@keyframes orbR{50%{transform:translateX(-4px)}}
.tc-body{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.tc-q{font-family:var(--font-scene);font-size:14px;color:var(--ivory);line-height:1.5;word-break:keep-all}
.tc-st{font-size:11.5px;color:var(--muted)}
.tc-go{color:var(--champagne);font-family:var(--font-display);font-size:18px}
.tele-q{font-family:var(--font-scene);font-size:17px;line-height:1.7;text-align:center;margin:6px 0 18px;word-break:keep-all}
.tele-picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tele-pick{border:1px solid var(--line);background:none;padding:13px 10px;font-size:14px;border-radius:2px;font-family:var(--font-serif-ko)}
.tele-pick:last-child:nth-child(odd){grid-column:1/-1}
.tele-pick:hover:not(:disabled){border-color:var(--champagne)}
.tele-pick:disabled{opacity:.4}.tele-pick.on{opacity:1;border-color:var(--champagne);color:var(--champagne);background:rgba(200,176,122,.08)}
.tele-reveal{text-align:center;padding:6px 0 2px}
.tr-row{display:flex;align-items:stretch;justify-content:center;gap:10px;margin:6px 0 16px}
.tr-side{flex:1;max-width:150px;border:1px solid var(--line);padding:16px 8px;display:flex;flex-direction:column;gap:8px;animation:trIn .8s cubic-bezier(.2,.9,.3,1) both}
.tr-side b{font-family:var(--font-scene);font-size:17px;font-weight:500;color:var(--ivory)}
.tr-mid{align-self:center;color:var(--champagne);font-size:18px;animation:trIn .6s 1.3s both}
.tele-reveal.same .tr-side{border-color:var(--champagne);box-shadow:0 0 26px rgba(255,217,143,.12)}
@keyframes trIn{from{opacity:0;transform:translateY(12px) rotateX(70deg)}to{opacity:1;transform:none}}
.tr-line{font-family:var(--font-serif-ko);font-size:13.5px;color:var(--muted);animation:trIn .6s 1.5s both}.tr-line b{color:var(--champagne);font-weight:400}
/* ---------- who is home, decorating ---------- */
.here-line{text-align:center;font-family:var(--font-serif-ko);font-size:12.5px;color:var(--champagne);margin:10px 0 0;min-height:0}
.here-line:empty{display:none}
.here-line i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#9fd59a;margin-right:8px;vertical-align:1px;box-shadow:0 0 8px #9fd59a}

function telePool(h){return TELE_ALL.concat(TELE_REL[h.rel]||TELE_REL.friend);}
function teleOrder(h){

    for(let i=idx.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
    const one=idx.indexOf(0);[idx[0],idx[one]]=[idx[one],idx[0]];   // day 1 is always the number test
    Object.defineProperty(h,'_teleOrder',{value:idx,enumerable:false,writable:true});}
  return h._teleOrder;
}
function teleQ(h,d){if(d<1||d>24)return null;const q=telePool(h)[teleOrder(h)[d-1]];return {text:q[0],choices:q[1]};}
// mine[d] = index; theirs[d] = index, or -1 when they answered but it is still secret
function teleOf(h){S.tele=S.tele||{};const t=S.tele[h.id]=S.tele[h.id]||{mine:{},theirs:{},seen:0};t.mine=t.mine||{};t.theirs=t.theirs||{};return t;}

function swapSides(h){

  const sent=h.sent,recv=h.recv;
  h.sent=recv.map(m=>{const x={...m};x.opened=!!m.hung;delete x.hung;return x;});
  h.recv=sent.map(m=>{const x={...m};x.hung=m.opened!==false;delete x.opened;delete x._pending;return x;});
  const mb=S.myBirthday||null;S.myBirthday=h.theirBirthday||null;h.theirBirthday=mb;

const TREE_IMG=new Map(),TREE_SRC=new Map(),TREE_PX=4;

    TREE_SRC.set(key,{url:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg),w:Math.ceil(w0*TREE_PX),h:Math.ceil(h0*TREE_PX)});queueTreeRaster();}

let treeQ=0;
function queueTreeRaster(){if(treeQ)return;treeQ=setTimeout(rasterTrees,60);}
async function rasterTrees(){
  for(const [key,src] of TREE_SRC){if(TREE_IMG.has(key))continue;
    try{const im=new Image();im.src=src.url;await im.decode();const c=document.createElement('canvas');c.width=src.w;c.height=src.h;c.getContext('2d').drawImage(im,0,0,src.w,src.h);
      const png=await new Promise(r=>c.toBlob(b=>r(b?URL.createObjectURL(b):''),'image/png'));if(!png)continue;TREE_IMG.set(key,png);
      document.querySelectorAll(`image[data-tk="${key}"]`).forEach(el=>el.setAttribute('href',png));}
    catch(e){TREE_IMG.set(key,src.url);}
    await new Promise(r=>setTimeout(r,0));}

function sparkTree(x,y,h,depth,bulbs){

  const n=Math.round(h*(3.0+near*1.3)),groups=['','',''];

    const t=Math.pow(R(),1.35),yy=y-h+t*h*.96,half=w*.5*t;
    const side=R()<.5?-1:1,off=Math.pow(R(),.6)*half*side;

    const cxp=(x+off).toFixed(1),cyp=yy.toFixed(1);

        d+=`<circle cx="${cxp}" cy="${cyp}" r="${r.toFixed(2)}" fill="${col}" opacity="${op.toFixed(2)}"/>`;

  const body=`<path d="M${x} ${(y-h).toFixed(1)}Q${(x+w*.2).toFixed(1)} ${(y-h*.55).toFixed(1)} ${(x+w*.5).toFixed(1)} ${(y-h*.04).toFixed(1)}Q${x} ${(y+h*.03).toFixed(1)} ${(x-w*.5).toFixed(1)} ${(y-h*.04).toFixed(1)}Q${(x-w*.2).toFixed(1)} ${(y-h*.55).toFixed(1)} ${x} ${(y-h).toFixed(1)}Z" fill="url(#${depth>.6?'tbF':'tb'})"/><path d="M${x} ${(y-h).toFixed(1)}Q${(x+w*.2).toFixed(1)} ${(y-h*.55).toFixed(1)} ${(x+w*.5).toFixed(1)} ${(y-h*.04).toFixed(1)}Q${x} ${(y+h*.03).toFixed(1)} ${(x-w*.5).toFixed(1)} ${(y-h*.04).toFixed(1)}Q${(x-w*.2).toFixed(1)} ${(y-h*.55).toFixed(1)} ${x} ${(y-h).toFixed(1)}Z" fill="url(#tShade)"/>`;
  const glow=`<ellipse cx="${x}" cy="${(y-h*.42).toFixed(1)}" rx="${(w*.5).toFixed(1)}" ry="${(h*.58).toFixed(1)}" fill="url(#treeGlow)" opacity="${(.4*near+.15).toFixed(2)}"/>`;

  return `<g class="sparktree">${glow}${body}${leafImage(`${x}|${y}|${h}|${depth}`,x0,y0,w0,h0,groups.join(''))}${b}</g>`;
}

/* the stars' quiet countdown. Nothing on screen says what they are becoming.
   15–17 Dec: now and then a star drifts a little
   18–21 Dec: once per visit they gather into the shape, twinkle, then scatter again
   22–24 Dec: they rest in the shape and twinkle (often on the 24th)
   25 Dec:    lines, names, steady glow */
let skyT=[];
function skyLife(h){
  skyT.forEach(clearTimeout);skyT=[];
  const svg=$('.sky-svg');if(!svg)return;
  const d=S.day,stars=[...svg.querySelectorAll('.ms')];
  svg.classList.remove('tw-slow','tw-fast');
  if(d>=25||!stars.length)return;
  const formed=!!(signOf(S.myBirthday)||signOf(h.theirBirthday));
  const at=(g,x,y)=>`translate(${x}px,${y}px)`,base=g=>at(g,g.dataset.ax,g.dataset.ay),goal=g=>at(g,g.dataset.tx,g.dataset.ty);
  if(formed&&d>=22){stars.forEach(g=>g.style.transform=goal(g));svg.classList.add(d===24?'tw-fast':'tw-slow');return;}
  if(reduce||d<15)return;
  const later=(fn,ms)=>skyT.push(setTimeout(()=>{if(S.screen==='sky'&&document.body.contains(svg))fn();},ms));
  const wander=()=>{const g=stars[Math.floor(Math.random()*stars.length)].querySelector('.wob');
    const dx=(Math.random()-.5)*16,dy=(Math.random()-.5)*12;
    g.animate([{transform:'translate(0,0)'},{transform:`translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px)`,offset:.5},{transform:'translate(0,0)'}],{duration:3800+Math.random()*2000,easing:'ease-in-out'});
    later(wander,2500+Math.random()*4500);};
  later(wander,1500);
  if(formed&&d>=18){
    later(()=>{svg.classList.add('tw-fast');
      stars.forEach((g,k)=>g.animate([{transform:base(g)},{transform:goal(g),offset:.28},{transform:goal(g),offset:.66},{transform:base(g)}],{duration:6200,delay:k*40,easing:'cubic-bezier(.45,.05,.35,1)'}));
      later(()=>svg.classList.remove('tw-fast'),6200+stars.length*40);},1800);
  }
}

function villageSleigh(){

/* ---------- sky + snow ---------- */
const cv=$('#sky-bg');const cx=cv.getContext('2d');const fg=$('#snow-fg');const fx=fg.getContext('2d');let W=0,Ht=0,stars=[],flakes=[],skyActive=true;
function resize(){const dpr=Math.min(window.devicePixelRatio||1,1.5);W=window.innerWidth;Ht=window.innerHeight;
  for(const [c,x] of [[cv,cx],[fg,fx]]){c.width=W*dpr;c.height=Ht*dpr;x.setTransform(dpr,0,0,dpr,0,0);}
  stars=Array.from({length:Math.round(W*Ht/4200)},()=>({x:Math.random()*W,y:Math.random()*Ht*.6,r:Math.random()*.9+.2,p:Math.random()*6}));
  flakes=Array.from({length:Math.round(W/6)},()=>({x:Math.random()*W,y:Math.random()*Ht,r:Math.random()*1.3+.35,v:Math.random()*.75+.4,w:Math.random()*6}));drawSky(0);drawSnow(0);}
function drawSky(t){
  const g=cx.createLinearGradient(0,0,0,Ht);g.addColorStop(0,'#05091a');g.addColorStop(.65,'#0c1530');g.addColorStop(1,'#16224a');cx.fillStyle=g;cx.fillRect(0,0,W,Ht);
  for(const s of stars){cx.globalAlpha=.35+.35*Math.sin(t/1400+s.p);cx.fillStyle='#f6ecd4';cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill();}
  cx.globalAlpha=1;
}
function drawSnow(t){fx.clearRect(0,0,W,Ht);fx.fillStyle='rgba(255,255,255,.7)';for(const f of flakes){if(f.hid)continue;fx.beginPath();fx.arc(f.x+Math.sin(t/1800+f.w)*6,f.y,f.r,0,7);fx.fill();}}
let blocks=[],blockT=0,skyDrawT=0;
function snowBlocks(){blocks=[];
  document.querySelectorAll('.scene [id^="hs-"], .plot .pill:not(.lot-pill), .sky-house').forEach(el=>{
    if(el.id&&el.id.startsWith('hs-')&&!S.houses[Number(el.id.slice(3))])return;
    const r=el.getBoundingClientRect();if(r.bottom<0||r.top>Ht)return;blocks.push([r.left+2,r.top+3,r.right-2,r.bottom]);});}
function loop(t){if(skyActive){if(t-blockT>400){blockT=t;snowBlocks();}
  for(const f of flakes){f.y+=f.v;const x=f.x+Math.sin(t/1800+f.w)*6;
    f.hid=blocks.some(b=>x>b[0]&&x<b[2]&&f.y>b[1]&&f.y<b[3]);if(f.y>Ht+4){f.y=-4;f.x=Math.random()*W;}}
  if(t-skyDrawT>80){skyDrawT=t;drawSky(t);}drawSnow(t);}requestAnimationFrame(loop);}

      save();closeModal();render();toast(`${n}의 집을 지었어요. 초대 링크는 다음 단계에서 만들어요`);break;}
    case 'reset':if(t.dataset.confirm==='1'){S=seedFix(seed());save();fillDemo();render();closeModal();toast('예시 데이터로 되돌렸어요');}
      else openModal(`${sheetHead('Reset','예시로 초기화할까요?')}<p class="hint-text" style="margin:0">내가 넣은 추억과 위시리스트가 지워지고 처음 예시로 돌아가요.</p><button class="primary" data-act="reset" data-confirm="1">초기화하기</button>`);break;
  }
}
window.addEventListener('resize',resize);
/* one shared clock for the tree lights: a single cheap repaint every half second instead of 124 animations */
if(!reduce){let ph=0;document.body.dataset.ph=0;setInterval(()=>{ph=(ph+1)%3;document.body.dataset.ph=ph;},500);}else document.body.dataset.ph=0;
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));

load();fillDemo();resize();render();
if(CLOUD)cloudInit();
if(!reduce)requestAnimationFrame(loop);
})();
</script>
</body>
